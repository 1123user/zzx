<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<!-- 内容安全策略：脚本只允许本站文件（禁止内联/外域脚本），
     这样即使有恶意字符串被塞进数据，也无法在本站执行脚本、篡改学习数据 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181b1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="政治线">
<meta name="description" content="考研政治五大板块：史纲时间线、毛中特理论脉络、马原知识树、思修法治主题、形势与政策年度清单，事件—会议—文献三层锚点互链">
<title>政治线 · 考研政治五大板块</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">

<script src="js/theme.js"></script>
<style>/* 首屏关键样式：内联，冷启动时 HTML 一到就能立刻画出界面骨架，无需等待样式表往返 */
:root{--bg:#f6f4ef;--bg-elevated:#ffffff;--bg-sunken:#eeeae2;--bg-hover:#f0ece4;--line:#e2ddd2;--line-soft:#ece7dd;
  --fg:#1d1b18;--fg-2:#57534b;--fg-3:#8d8880;--accent:#b8322f;--r:14px;--r-sm:9px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
html[data-theme="dark"]{--bg:#0f1113;--bg-elevated:#181b1e;--bg-sunken:#0b0d0f;--bg-hover:#20242a;--line:#2b3036;--line-soft:#232729;--fg:#e9e6e1;--fg-2:#a8a49d;--fg-3:#75716b;--accent:#e0685f}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#0f1113;--bg-elevated:#181b1e;--bg-sunken:#0b0d0f;--bg-hover:#20242a;--line:#2b3036;--line-soft:#232729;--fg:#e9e6e1;--fg-2:#a8a49d;--fg-3:#75716b;--accent:#e0685f}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;color:var(--fg);font:15px/1.72 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
/* 画布底色＝界面本色：状态栏与底部横条区域不再露出页面底色（消除上下的灰带/黑边） */
html{background:var(--bg-elevated)}
body{background:var(--bg)}
button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}
.app{display:flex;height:100%;height:100dvh}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg-elevated)}
.topbar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.topbar-title strong{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-title span{font-size:11.5px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--fg-2);flex:0 0 auto}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 44px}
.hero{padding:8px 0 22px;border-bottom:1px solid var(--line-soft)}
.hero h1{font-size:25px;margin:0 0 8px;line-height:1.34}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--fg-2);font-size:13.5px}
.sidebar{width:274px;flex:0 0 274px;background:var(--bg-elevated);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px 10px;overflow-y:auto;z-index:40}
.sk-card{height:76px;border-radius:var(--r);border:1px solid var(--line);margin:0 0 10px;background:linear-gradient(100deg,var(--bg-sunken) 30%,var(--bg-hover) 50%,var(--bg-sunken) 70%);background-size:220% 100%;animation:skpulse 1.2s linear infinite}
@keyframes skpulse{from{background-position:130% 0}to{background-position:-30% 0}}
/* 登录/注册页与账号入口（内联，首屏秒出） */
body.auth-mode .sidebar{display:none}
body.auth-mode #menuBtn,body.auth-mode #searchBtn,body.auth-mode .progress-strip,body.auth-mode #actionbar{display:none !important}
.auth-wrap{max-width:430px;margin:0 auto;padding:26px 18px 44px}
.auth-card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px}
.auth-tabs{display:flex;gap:6px;margin:0 0 16px}
.auth-tab{flex:1;padding:9px;border-radius:var(--r-sm);background:var(--bg-sunken);font-size:13.5px;color:var(--fg-2);border:1px solid var(--line)}
.auth-tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.auth-field{margin:0 0 12px}
.auth-field label{display:block;font-size:12px;color:var(--fg-3);margin:0 0 5px}
.auth-field input{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg-sunken);font-size:15px;color:var(--fg)}
.auth-field input:focus{outline:none;border-color:var(--accent)}
.auth-actions{display:flex;gap:8px;margin-top:16px}
.auth-btn{flex:1;padding:12px;border-radius:var(--r-sm);background:var(--bg-sunken);border:1px solid var(--line);font-size:14px;color:var(--fg)}
.auth-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.auth-msg{min-height:18px;font-size:12.5px;color:var(--accent);margin:8px 0 0}
.auth-note{font-size:12px;color:var(--fg-3);line-height:1.75;margin:12px 0 0}
.auth-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);margin:10px 0 0}
.auth-switch{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);text-align:center;font-size:12.5px;color:var(--fg-3)}
.auth-link{margin-left:2px;padding:4px 6px;color:var(--accent);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.auth-extra{margin-top:10px}
.auth-extra .auth-btn{width:100%;padding:11px;font-size:13px}
.user-row{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-sm);background:var(--bg-sunken);font-size:12.5px}
.user-row .u-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.user-row .u-btn{font-size:12px;color:var(--accent);padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--bg-elevated)}
@media (max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:100%;flex-basis:100%;transform:translateX(-101%);box-shadow:none}
  .wrap{padding:14px 14px 40px}
  .hero h1{font-size:21px}
}
</style>
<link rel="stylesheet" href="css/app.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="css/app.css"></noscript>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="侧边栏">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="34" height="34">
      <div class="brand-text">
        <strong>政治线</strong>
        <span>考研政治 · 五大板块</span>
      </div>
      <button class="side-close" id="sideClose" type="button" aria-label="关闭菜单">✕</button>
    </div>

    <button class="side-action" id="timelineBtn" type="button">
      <span>双主线时间轴</span><i>事件 ⇄ 党的政策</i>
    </button>
    <button class="side-action" id="quizBtn" type="button">
      <span>随机自测练习</span><i id="quizTotal"></i>
    </button>
    <button class="side-action" id="caseBtn" type="button">
      <span>案例反查原理</span><i>马原专用</i>
    </button>
    <button class="side-action" id="essayBtn" type="button">
      <span>材料分析题</span><i>2010—2024 · 34—38 题</i>
    </button>
    <button class="side-action" id="analysisBtn" type="button">
      <span>错题与薄弱分析</span><i id="wrongBadge">暂无错题</i>
    </button>

    <div class="user-row" id="userRow">
      <span class="u-name" id="userName">未登录</span>
      <button class="u-btn" id="switchUserBtn" type="button">切换</button>
      <button class="u-btn" id="logoutBtn" type="button">退出</button>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">板块</div>
      <nav class="subject-nav" id="subjectNav" aria-label="板块"></nav>
    </div>

    <div class="sidebar-block" id="filterBlock">
      <div class="sidebar-label">锚点类型</div>
      <div class="filter-row" id="kindFilter"></div>
    </div>

    <div class="sidebar-block" id="moduleBlock" hidden>
      <div class="sidebar-label" id="moduleLabel">单元导航</div>
      <div class="module-list" id="moduleList"></div>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">今日计划</div>
      <div id="planBody"></div>
    </div>

    <div class="sidebar-foot">
      <div class="sidebar-label">依据《2027 年考研政治考试大纲》梳理</div>
      <button class="ghost-btn" id="themeBtn" type="button">外观：跟随系统</button>
      <button class="ghost-btn" id="imgBtn" type="button">图片：显示</button>
      <button class="ghost-btn" id="resetBtn" type="button">清空学习进度</button>
      <button class="ghost-btn" id="packBtn" type="button">下载全部配图（离线秒开）</button>
      <button class="ghost-btn" id="exportBtn" type="button">导出学习数据（备份）</button>
      <button class="ghost-btn" id="importBtn" type="button">导入学习数据（恢复）</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="ghost-btn" id="spaceBtn" type="button">存储占用与清理</button>
      <button class="ghost-btn" id="cacheBtn" type="button">重置离线缓存</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="打开菜单">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75Zm0 5a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 12.75Z"/></svg>
      </button>
      <div class="topbar-title">
        <strong id="topTitle">政治线</strong>
        <span id="topSub">选择板块开始学习</span>
      </div>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="搜索知识点">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      </button>
    </header>

    <div class="progress-strip" id="progressStrip" hidden>
      <div class="pstrip-head">
        <div class="bar"><i id="progressBar" style="width:0%"></i></div>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="pstrip-track" id="pstripTrack" role="tablist" aria-label="考点快速跳转" title="点击任一刻度可跳转到对应考点"></div>
    </div>

    <section class="view" id="viewHome">
      <div class="wrap boot">
        <div class="hero">
          <h1>把考点连成<em>一条线</em></h1>
          <p>考研政治 · 马原 / 毛中特 / 史纲 / 思修法治 / 形策</p>
          <div class="boot-hint"><i class="boot-spin"></i><span>正在加载考点数据…</span></div>
        </div>
        <div aria-hidden="true"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div>
      </div>
    </section>
    <section class="view" id="viewStudy" hidden></section>
    <section class="view" id="viewQuiz" hidden></section>
    <section class="view" id="viewLine" hidden></section>
    <section class="view" id="viewCase" hidden></section>
    <section class="view" id="viewEssay" hidden></section>
    <section class="view" id="viewAnalysis" hidden></section>
    <section class="view" id="viewAuth" hidden></section>
    <div class="actionbar" id="actionbar" hidden></div>
  </main>
</div>

<div class="overlay" id="searchOverlay" hidden>
  <div class="overlay-head">
    <div class="search-box">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      <input id="searchInput" type="search" placeholder="输入年份 / 事件 / 会议 / 文献 / 原理" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="text-btn" id="searchClose" type="button">取消</button>
  </div>
  <div class="search-filters" id="searchFilters"></div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="overlay" id="imgOverlay" hidden>
  <div class="img-toolbar">
    <span class="img-zoom-label" id="imgZoomLabel">适应</span>
    <button class="img-tool-btn" id="imgZoomOut" type="button" aria-label="缩小">−</button>
    <button class="img-tool-btn" id="imgZoomIn" type="button" aria-label="放大">＋</button>
    <button class="img-tool-btn" id="imgZoomFit" type="button">适应宽度</button>
    <button class="img-tool-btn" id="imgZoomOne" type="button">1:1</button>
    <span class="img-tool-spacer"></span>
    <button class="img-tool-btn img-close" id="imgClose" type="button">关闭</button>
  </div>
  <div class="img-stage" id="imgStage">
    <img id="imgBig" alt="" draggable="false">
  </div>
  <div class="img-cap" id="imgCap"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
